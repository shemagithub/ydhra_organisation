kind = "web"
previewPath = "/"
title = "YDHRA Organisation Website"
description = "A warm, credible public-facing website for Youth for Development and Human Rights Advancement, sharing its mission, vision, objectives, and ways to support youth and women in Rwanda and beyond."
version = "1.0.0"
id = "artifacts/ydhra-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20263

[services.development]
run = "pnpm --filter @workspace/ydhra-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ydhra-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/ydhra-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20263"
BASE_PATH = "/"
